<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}CEREFAS{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        (function() {
            const hora = new Date().getHours();
            if (hora >= 7 && hora < 19) {
                document.documentElement.setAttribute('data-theme', 'day');
            }
        })();
    </script>
    <style>
        html[data-theme="day"] body {
            background-color: #f1f5f9 !important;
            color: #1e293b !important;
        }
        html[data-theme="day"] .bg-zinc-950 { background-color: #ffffff !important; }
        html[data-theme="day"] .bg-zinc-900 { background-color: #f8fafc !important; border-color: #e2e8f0 !important; }
        html[data-theme="day"] .text-white { color: #0f172a !important; }
        html[data-theme="day"] .text-zinc-500, html[data-theme="day"] .text-zinc-400 { color: #475569 !important; }
        html[data-theme="day"] input, html[data-theme="day"] select, html[data-theme="day"] textarea {
            background-color: #ffffff !important; color: #0f172a !important; border-color: #cbd5e1 !important;
        }
        html[data-theme="day"] .border-zinc-800, html[data-theme="day"] .border-zinc-700 { border-color: #e2e8f0 !important; }
        html[data-theme="day"] .hover\:bg-zinc-800:hover { background-color: rgba(0,0,0,0.05) !important; }
    </style>
</head>
<body class="bg-zinc-950 text-white min-h-screen flex flex-col">
    {% if usuario %}
    <nav class="bg-zinc-900 border-b border-zinc-800 p-4 shadow-md">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex gap-6 items-center">
                <span class="font-bold text-xl text-emerald-400 tracking-wider">🐾 CEREFAS</span>
                <a href="/" class="text-zinc-300 hover:text-emerald-400 transition-colors font-semibold">Registros</a>
                <a href="/pacientes" class="text-zinc-300 hover:text-emerald-400 transition-colors font-semibold">Pacientes Actuales</a>
            </div>
            <div class="flex gap-4 items-center">
                <span class="text-zinc-500 text-sm flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                    {{ usuario }}
                </span>
                <a href="/logout" class="bg-rose-900/50 text-rose-400 hover:bg-rose-900 hover:text-rose-200 px-3 py-1 rounded text-sm transition-colors border border-rose-800">Salir</a>
            </div>
        </div>
    </nav>
    {% endif %}
    
    <div class="max-w-7xl mx-auto p-4 md:p-8 w-full flex-1">
        {% block content %}{% endblock %}
    </div>

    {% block scripts %}{% endblock %}
</body>
</html>
