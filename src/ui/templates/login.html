{% extends "base.html" %}

{% block title %}Login - CEREFAS{% endblock %}

{% block content %}
<div class="max-w-md mx-auto mt-20 bg-zinc-900 p-8 rounded-2xl border border-zinc-800 shadow-2xl">
    <div class="text-center mb-8">
        <span class="text-5xl">🐾</span>
        <h2 class="text-2xl font-bold mt-4 text-emerald-400">Acceso CEREFAS</h2>
        <p class="text-zinc-500 text-sm mt-1">Ingresa tus credenciales médicas</p>
    </div>
    {% if error %}
    <div class='bg-rose-900/50 p-3 mb-4 rounded text-sm text-rose-300 border border-rose-800 text-center'>{{ error }}</div>
    {% endif %}
    <form method="POST">
        <div class="mb-4">
            <label class="block text-xs text-zinc-500 uppercase mb-1 font-bold">Correo Electrónico</label>
            <input type="email" name="correo" placeholder="ejemplo@uss.cl" class="w-full bg-zinc-950 border border-zinc-700 p-3 rounded-lg focus:border-emerald-500 outline-none text-white transition-colors" required>
        </div>
        <div class="mb-6">
            <label class="block text-xs text-zinc-500 uppercase mb-1 font-bold">Contraseña</label>
            <input type="password" name="password" placeholder="••••••••" class="w-full bg-zinc-950 border border-zinc-700 p-3 rounded-lg focus:border-emerald-500 outline-none text-white transition-colors" required>
        </div>
        <button type="submit" class="w-full bg-emerald-700 hover:bg-emerald-600 text-white font-bold p-3 rounded-lg transition-colors shadow-lg">Iniciar Sesión</button>
    </form>
</div>
{% endblock %}
